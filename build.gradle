plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'RecipeBookApp'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    // Опционально: можно управлять версией testcontainers вручную,
    // но Spring Boot Dependency Management обычно подтягивает совместимую версию.
    // set('testcontainersVersion', '1.19.8')
}

dependencies {
    // 🌐 Web & REST API
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 🗄️ Database & JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ Validation (Jakarta)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 🛠️ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 🔍 DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 🧪 Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 🐳 Testcontainers Support
    // 1. Основной модуль для Spring Boot интеграции
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // 2. Модуль для конкретного контейнера (PostgreSQL)
    testImplementation 'org.testcontainers:postgresql'

    // 3. Модуль для JUnit 5 интеграции (@Container, @ServiceConnection)
    testImplementation 'org.testcontainers:junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()

    // Важно для Testcontainers: увеличиваем время ожидания, если контейнеры долго стартуют
    // и передаем свойства, если нужно
    systemProperty 'testcontainers.reuse.enable', 'true' // Опционально: переиспользование контейнеров
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}