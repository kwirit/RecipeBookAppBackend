plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'RecipeBookApp'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    // Опционально: можно управлять версией testcontainers вручную,
    // но Spring Boot Dependency Management обычно подтягивает совместимую версию.
    // set('testcontainersVersion', '1.19.8')
}

dependencies {
    // 🌐 Web & REST API
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 🗄️ Database & JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ Validation (Jakarta)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 🛠️ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 🔍 DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 🧪 Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    // 🐳 Testcontainers Support
    // 1. Основной модуль для Spring Boot интеграции
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // 2. Модуль для конкретного контейнера (PostgreSQL)
    testImplementation 'org.testcontainers:postgresql'

    // 3. Модуль для JUnit 5 интеграции (@Container, @ServiceConnection)
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.7.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'commons-io:commons-io:2.15.1'

}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()

    // Важно для Testcontainers: увеличиваем время ожидания, если контейнеры долго стартуют
    // и передаем свойства, если нужно
    systemProperty 'testcontainers.reuse.enable', 'true' // Опционально: переиспользование контейнеров
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}