<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет питания</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
    <nav class="nav">
        <a href="#/products" class="nav-link">Продукты</a>
        <a href="#/dishes" class="nav-link">Блюда</a>
    </nav>
</header>

<main id="app" class="container">
    <!-- Views will be injected here -->
</main>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="toast-container"></div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="confirm-title">Подтверждение</h3>
            <p id="confirm-message"></p>
            <div id="confirm-extra" class="conflict-dishes"></div>
            <div class="modal-actions">
                <button id="confirm-cancel" class="btn btn-secondary">Отмена</button>
                <button id="confirm-ok" class="btn btn-danger">Подтвердить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
